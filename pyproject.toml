# The nuverse workspace: the packages under pkgs/, each its own PyPI project.
#
# Not a package itself. It holds the uv workspace, the shared dev deps, and
# the ruff and pytest config every package uses.

[project]
name = "nuverse-workspace"
version = "0"
requires-python = ">=3.10"

[tool.uv]
package = false
default-groups = ["dev"]

# torch (the nudemos mnist extra) stopped shipping Intel macOS wheels
# after 2.2, and 2.2 wants numpy 1.
constraint-dependencies = [
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision<0.18; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["pkgs/*"]

[tool.uv.sources]
nuverse = { workspace = true }
nudemos = { workspace = true }
nuagent = { workspace = true }
nulog = { workspace = true }
nuspace = { path = "../nuspace", editable = true }
nuspace-ui = { path = "../nuspace/pkgs/ts/nuspace-ui", editable = true }
nucore = { path = "../nu", editable = true }
nustd = { path = "../nu/pkgs/nustd", editable = true }
nuskills = { path = "../nuskills", editable = true }

[dependency-groups]
dev = [
    "nuverse",
    "nudemos[mnist,memes,agents]",
    "nuagent[cc,llm]",
    "nulog[space]",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# `tests/_lib` is the only test directory on sys.path, and `_support` the only
# thing in it: shared helpers, importable by spawned workers too.
pythonpath = [
    "tests/_lib",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
source = [
    "pkgs",
]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "pkgs/*/src",
]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "YTT",
    "S",
    "T20",
    "D",
    "ANN",
    "TC",
    "RUF",
    "PTH",
]
ignore = [
    "E501",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101", "S108", "T20", "D", "E711", "E712", "ANN", "N806",
]

[tool.ruff.lint.isort]
known-first-party = [
    "nuverse",
    "nudemos",
    "nuagent",
    "nulog",
    "nuspace",
    "nu",
    "nustd",
    "nuskills",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
