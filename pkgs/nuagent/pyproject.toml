[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuagent"
version = "0.2.2"
description = "nuagent: the model answers in Nu, Nu runs the answer."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # The core needs only nu. The Chat plane for nuspace is the ``space`` extra.
    "nucore>=0.6.5",
    "nustd[kv]>=0.6.5",
    # The generic Nu prose the opening prompt is assembled from.
    "nuskills>=0.2.0",
]

[project.optional-dependencies]
# The cc backend drives Claude Code through nustd.cc, on the local claude login.
cc = [
    "nustd[cc]",
]
# The llm backend talks to a stateless endpoint through nustd.llm.
llm = [
    "nustd[llm]",
]
# The Chat plane, a nuspace extension: a conversation with an agent in a space.
space = [
    "nuspace>=0.5.4",
]

[project.urls]
Repository = "https://github.com/nustackdev/nuverse"

[project.entry-points."nuspace.extensions"]
nuagent = "nuagent:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/nuagent"]
