[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nudemos"
version = "0.1.1"
description = "The Nu demos as nuspace Planes: a counter, a sampled series, a film base and MNIST trained live."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "nuspace",
]

[project.optional-dependencies]
mnist = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# The memes demo's JSON-RPC calls go through nustd.http.
memes = [
    "nustd[http]",
]
# The agents demo drives Claude Code through nustd.cc, on the local claude login.
agents = [
    "nustd[cc]",
]
# The design demo draws its release PNGs with Pillow and numpy.
design = [
    "pillow",
    "numpy",
]
# The ops demo writes and reads its logs and metrics through nulog.
ops = [
    "nulog",
]
# The data demo computes over its tables with numpy.
data = [
    "numpy",
]
# The research and knowledge demos ask Claude through nustd.cc, on the local claude login.
research = [
    "nustd[cc]",
]
knowledge = [
    "nustd[cc]",
]

[project.urls]
Repository = "https://github.com/nustackdev/nuverse"

[project.entry-points."nuspace.extensions"]
nudemos = "nudemos:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/nudemos"]
