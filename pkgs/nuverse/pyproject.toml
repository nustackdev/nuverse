[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuverse"
version = "0.3.3"
description = "nuverse std: the Planes and Cells every nuspace space ships with."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
# No nuspace here: nuspace depends on nuverse, not the other way round.
# nuverse is a plugin the host installs. It imports nuspace, which is always
# there when it loads, and nuspace finds it only through the entry point
# below, the same one a third party uses.
dependencies = []

[project.urls]
Repository = "https://github.com/nustackdev/nuverse"

[project.entry-points."nuspace.extensions"]
nuverse = "nuverse:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/nuverse"]
