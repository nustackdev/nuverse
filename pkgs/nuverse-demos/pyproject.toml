[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuverse-demos"
version = "0.0.1"
description = "The Nu demos as nuspace Planes: a counter, a sampled series and a movie shelf."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "nuspace",
]

[project.urls]
Repository = "https://github.com/nustackdev/nuverse"

[project.entry-points."nuspace.extensions"]
nuverse-demos = "nuverse_demos:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/nuverse_demos"]
